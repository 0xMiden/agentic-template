[package]
name = "local-counter-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
integration = { path = "../../project-template/integration" }
miden-client = { version = "=0.17.2", features = ["tonic"] }
miden-client-sqlite-store = "=0.17.2"
miden-mast-package = "=0.35.0"
miden-standards = { version = "=0.17.1", features = ["testing"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
